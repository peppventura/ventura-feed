name: Gerar e publicar feed XML

on:
  schedule:
    - cron: "0 6,14,22 * * *"     # 03h, 11h e 19h de Brasilia
  workflow_dispatch:              # botao "Run workflow" para rodar na hora
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar o feed
        env:
          NUVEM_STORE_ID: ${{ secrets.NUVEM_STORE_ID }}
          NUVEM_ACCESS_TOKEN: ${{ secrets.NUVEM_ACCESS_TOKEN }}
        run: python3 feed.py --out public/feed.xml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
